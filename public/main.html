<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Ansible Web Control 1.x</title><link rel="stylesheet" href="/style.css"></head><body><div class="overlay"><div id="nav"></div><div id="project_selector"></div><div class="page-wrap"><div id="host_summary" class="host-summary"></div><div class="block"><div class="section-head"><h3>Объект</h3><select id="object_select" onchange="changeObject()"></select></div></div><div class="block"><div class="section-head"><h3>Хосты</h3><div class="btn-row compact"><button onclick="selectHosts(true)">Все</button><button onclick="selectHosts(false)">Сбросить</button></div></div><div class="host-pick-grid"><div><b>Сервера</b><div id="servers"></div></div><div><b>АРМ</b><div id="arms"></div></div></div></div><div class="block"><div class="section-head"><h3>Плейбуки</h3><div class="btn-row compact"><button onclick="selectPB()">Выбрать все</button><button onclick="clearPB()">Отменить выбор</button></div></div><div id="playbooks" class="playbook-list"></div><div class="run-row"><button class="primary" onclick="runSelected()">Запуск</button><button onclick="stopExecution()">Завершить</button></div></div><div class="block"><div class="section-head"><h3>Выполнение</h3><span id="run_state">Готов</span></div><pre id="log" class="log"></pre></div></div></div><script src="/common.js"></script><script src="/main.js"></script></body></html>
