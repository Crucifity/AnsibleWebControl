<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Панель управления</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="overlay">
    <div id="nav"></div>
    <div id="project_selector"></div>

    <div class="page-wrap">
      <div class="block">
        <h3>Autodeploy IP: <span id="local_ip">...</span></h3>
        <div id="autodeploy"></div>
        <div class="btn-row">
          <button onclick="runAutodeploy()">Запустить Autodeploy</button>
      </div>
    </div>

    <div class="block">
      <h3>Хосты</h3>
      <div class="btn-row">
        <button onclick="selectAll()">Выбрать все</button>
        <button onclick="selectServers()">Выбрать все Сервера</button>
        <button onclick="selectArms()">Выбрать все АРМ</button>
        <button onclick="clearAll()">Отменить выбор</button>
      </div>

      <div class="grid">
        <div>
          <h4>Сервера</h4>
          <div id="servers"></div>
        </div>
        <div>
          <h4>АРМ</h4>
          <div id="arms"></div>
        </div>
      </div>
    </div>

    <div class="block">
      <h3>Плейбуки</h3>
      <div class="btn-row">
        <button onclick="selectPB()">Выбрать все</button>
        <button onclick="clearPB()">Отменить выбор</button>
      </div>
      <div id="playbooks"></div>
    </div>

    <div class="block">
      <h3>Управление запуском</h3>
      <div class="action-panel">
        <button onclick="runSelected()">Запустить</button>
        <button onclick="stopExecution()">Завершить</button>
        <button onclick="toggleLogHeight()">Развернуть / Свернуть лог</button>
      </div>
    </div>

    <div class="block">
      <h3>Log</h3>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/main.js"></script>
</body>
</html>
