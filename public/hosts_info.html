<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Информация о хостах</title><link rel="stylesheet" href="/style.css"><style>.host-card{border:1px solid #555;border-radius:8px;margin:10px 0;overflow:hidden}.host-head{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}.host-head .title{flex:1;font-weight:600}.host-actions{display:flex;gap:6px}.host-body{padding:14px;border-top:1px solid #444;background:rgba(0,0,0,.12)}.param-grid{display:grid;grid-template-columns:minmax(180px,.7fr) minmax(250px,1.5fr);gap:8px 14px;align-items:center}.param-grid label{font-weight:600;word-break:break-word}.param-grid input{width:100%;box-sizing:border-box}.host-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.host-card .edit-save{display:none}.host-card.editing .edit-save{display:inline-block}.host-card.editing .readonly{display:none}.host-card:not(.editing) input{border-color:transparent;background:transparent}.add-host{margin:18px 0;padding:14px}.danger{background:#a33}.empty{padding:20px;opacity:.7}</style></head><body><div class="overlay"><div id="nav"></div><div id="project_selector"></div><div class="page-wrap"><div id="host_summary" class="host-summary"></div><div class="block"><div class="section-head"><h3>Объект</h3><select id="object_select" onchange="changeObject()"></select></div></div><div class="block"><h3>Сервера</h3><div id="servers_list"></div></div><div class="block"><h3>АРМ</h3><div id="arms_list"></div></div><div class="block add-host"><h3>Добавить хост</h3><div id="new_host_form"></div><div class="host-footer"><button onclick="addHost()">Добавить</button></div></div></div></div><script src="/common.js"></script><script src="/hosts_info.js"></script></body></html>
