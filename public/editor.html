<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактор</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="overlay">
        <div id="nav"></div>

        <div class="page-wrap">
            <div id="project_selector"></div>

            <div id="host_summary" class="host-summary"></div>

            <div class="block">
                <div class="section-head">
                    <h3>Объект</h3>
                    <select id="object_select" onchange="changeObject()"></select>
                </div>
            </div>

            <div class="block">
                <h3>Плейбук</h3>
                <select id="playbook_select" onchange="loadPlaybook()"></select>
                <textarea id="playbook_editor" spellcheck="false"></textarea>
                <div class="btn-row">
                    <button class="primary" onclick="savePlaybook()">Сохранить</button>
                </div>
            </div>

            <div class="block">
                <h3>hosts / defaults</h3>
                <div class="editor-grid">
                    <textarea id="hosts_editor"></textarea>
                    <textarea id="defaults_editor"></textarea>
                </div>
                <div class="btn-row">
                    <button onclick="saveFiles()">Сохранить hosts и defaults</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/common.js"></script>
    <script src="/editor.js"></script>
</body>
</html>
